spring.application.name=api-gateway
server.port=${PORT}

# JWT Configuration Secret for AuthenticationFilter
jwt.secret=${JWT_SECRET}

# Route Configuration 8082
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

# User Service ka Route 8081
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/users/**

# Provider Service Route 8083
spring.cloud.gateway.routes[2].id=provider-service
spring.cloud.gateway.routes[2].uri=lb://provider-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/providers/**

# Booking Service Route 8084
spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=lb://booking-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/bookings/**

# Payment Service Route 8085
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://payment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/payments/**

# 1. Reliability & Timeouts (5 seconds max for any downstream service)
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=5s

# 2. Monitoring & Actuator Health
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# 3. Missing Notification Service Route
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://notification-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/notifications/**

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true