plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
}

group = 'com.servicehub'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2023.0.1")
}

dependencies {
    // 1. Spring Boot Native BOM (Ye line plugin ki kami poori kar degi bina kisi error ke)
    implementation platform("org.springframework.boot:spring-boot-dependencies:3.2.4")

    // 2. Spring Cloud Native BOM
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")

    // Ab in starters ke versions automatically resolve ho jayenge
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'com.mysql:mysql-connector-j:8.3.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'


    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // Resilience4j Circuit Breaker
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    // AOP zaroori hai @CircuitBreaker annotation ke liye
    implementation 'org.springframework.boot:spring-boot-starter-aop'
}

tasks.named('test') {
    useJUnitPlatform()
}