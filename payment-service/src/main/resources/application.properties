server.port=${PORT}
spring.application.name=payment-service
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}

# JPA/Hibernate Configuration
# Hibernate DDL Auto (Automatic Table Creation)

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show.sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Circuit Breaker Configuration for Booking Service
resilience4j.circuitbreaker.instances.bookingService.sliding-window-size=5
resilience4j.circuitbreaker.instances.bookingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookingService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bookingService.permitted-number-of-calls-in-half-open-state=3

# Custom Kafka Topic Name
kafka.topic.payment-notification=payment-notification-topic

spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

##Logic: Agar pichli 5 requests mein se 50% (yani 3) fail ho gayi, toh circuit break (OPEN) ho jayega. 10 second tak koi request Booking service ko nahi jayegi (seedha fallback chalega), aur phir ye HALF-OPEN hokar check karega ki service wapas aayi ya nahi.

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true